# Render-Blueprint fuer den Freunde-Server (siehe server/README.md).
services:
  - type: web
    name: vortex-friends
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
