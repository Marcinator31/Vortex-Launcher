name: Windows Release

# Baut Setup- und Portable-EXE und veroeffentlicht sie als GitHub Release.
# Ausloesen: Tag pushen (z. B. v2.0.0) oder unter "Actions" manuell starten.
# Der Auto-Updater im Launcher liest genau diese Releases.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: EXE bauen und Release veroeffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: EXE-Dateien als Artefakt behalten
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Client-Launcher
          path: |
            release/*.exe
            release/latest.yml
