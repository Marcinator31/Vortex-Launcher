name: Launcher bauen und veroeffentlichen

# Laeuft bei JEDER Aenderung (Branch main/master) und veroeffentlicht die
# EXE unter "Releases" in diesem Repo. Alle Launcher sehen dann "Neues Update".
# Kein Token noetig -- GitHub stellt fuer dieses Repo selbst einen bereit.
#
# Versionsnummer: Major.Minor aus package.json + laufende Build-Nummer,
# z. B. 2.1.14. So ist jeder Build automatisch neuer als der vorige.
#
# Ohne Build: "[skip ci]" in die Commit-Nachricht schreiben.
# Nur .md-Dateien geaendert: kein Build.

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      # Die automatische Veroeffentlichung von Client/Addon ist kein Launcher-Update
      - '.github/scripts/**'
      - '.github/workflows/sync-vortex-files.yml'
      # Fehlerberichte aus der Beta-Checkliste sind kein Launcher-Update
      - 'beta-reports/**'
      # Einladungsseite (GitHub Pages) ist kein Launcher-Update
      - 'docs/**'
      # Freunde-Server laeuft woanders (Render/VPS) -- kein Launcher-Update
      - 'server/**'
      # Menue-Panoramen fuer den Client (werden vom Spiel direkt geladen)
      - 'wallpapers/**'
      # Werkzeuge/Labore
      - 'tools/**'
  workflow_dispatch:

# Mehrere Aenderungen kurz hintereinander: nur der neueste Build laeuft zu Ende.
concurrency:
  group: launcher-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Versionsnummer setzen
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Baue Version $VERSION"

      # Electron und electron-builder laden ihre Programme von GitHub nach. Ist
      # GitHub kurz gestoert (z. B. "503 Service Unavailable"), scheiterte der
      # ganze Build -- deshalb Zwischenspeicher + bis zu drei Versuche.
      - name: Electron-Downloads zwischenspeichern
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Abhaengigkeiten installieren
        shell: bash
        run: |
          for versuch in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci fehlgeschlagen (Versuch $versuch von 3) -- neuer Versuch in 30 s"
            sleep 30
          done
          echo "::error::npm ci ist dreimal fehlgeschlagen"
          exit 1

      # Mitgelieferte Vortex-Dateien auf den Stand von heute bringen: Wer den
      # Launcher frisch installiert und (noch) keine Verbindung zum Update-
      # Server bekommt, hat sonst eine uralte Client-Version im Spiel.
      - name: Mitgelieferte Vortex-Dateien aktualisieren
        shell: bash
        run: python .github/scripts/bundle_vortex_files.py || echo "::warning::Mitgelieferte Vortex-Dateien nicht aktualisiert"

      # Tag + Release zuerst anlegen: GitHub verlangt fuer ein veroeffentlichtes
      # Release einen existierenden Tag. electron-builder laedt die EXEs dann in
      # dieses Release hoch.
      - name: Release v${{ env.VERSION }} anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon."
          else
            # NOCH NICHT "latest": Launcher fragen GitHub nach dem neuesten Release.
            # Zeigte "latest" schon jetzt hierher, faenden sie waehrend des Builds
            # (und nach einem abgebrochenen Build fuer immer) keine latest.yml.
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Vortex Client Launcher $VERSION" \
              --notes "$(git log -1 --pretty=%B)" --latest=false
          fi

      - name: EXE bauen und veroeffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Erst jetzt, mit EXE und latest.yml im Release: fuer alle Launcher freigeben.
      # Alte Releases ohne Dateien (abgebrochene Builds) werden aufgeraeumt.
      - name: Als neueste Version freigeben
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          N=$(gh release view "v$VERSION" --json assets --jq '[.assets[].name | select(. == "latest.yml")] | length')
          if [ "$N" != "1" ]; then echo "::error::latest.yml fehlt im Release v$VERSION -- nicht freigegeben"; exit 1; fi
          gh release edit "v$VERSION" --latest
          echo "v$VERSION ist jetzt die neueste Version."
          gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | select((.assets | length) == 0) | select(.tag_name != "v'"$VERSION"'") | .tag_name' | while read t; do
            echo "Leeres Release $t (abgebrochener Build) wird entfernt"
            gh release delete "$t" --yes --cleanup-tag || true
          done

      - name: EXE-Dateien zusaetzlich hier speichern
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Client-Launcher-${{ env.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 7
