name: Launcher bauen und veroeffentlichen

# Laeuft bei JEDER Aenderung (Branch main/master) und veroeffentlicht die
# EXE unter "Releases" in diesem Repo. Alle Launcher sehen dann "Neues Update".
# Kein Token noetig -- GitHub stellt fuer dieses Repo selbst einen bereit.
#
# Versionsnummer: Major.Minor aus package.json + laufende Build-Nummer,
# z. B. 2.1.14. So ist jeder Build automatisch neuer als der vorige.
#
# Ohne Build: "[skip ci]" in die Commit-Nachricht schreiben.
# Nur .md-Dateien geaendert: kein Build.

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Mehrere Aenderungen kurz hintereinander: nur der neueste Build laeuft zu Ende.
concurrency:
  group: launcher-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Versionsnummer setzen
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Baue Version $VERSION"

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: EXE bauen und veroeffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: EXE-Dateien zusaetzlich hier speichern
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Client-Launcher-${{ env.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 7
