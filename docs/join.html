<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vortex Client – Server beitreten</title>
<meta name="description" content="Einladung zu einem Minecraft-Server mit dem Vortex Client Launcher.">
<meta property="og:title" content="Server beitreten – Vortex Client">
<meta property="og:description" content="Klicken, um direkt mit dem Vortex Client Launcher zu verbinden.">
<meta name="theme-color" content="#7c5cff">
<style>
  :root { --bg:#07070d; --card:#11111c; --line:#26263a; --text:#ecebff; --dim:#9a98b8; --v:#8b5cf6; --b:#3b82f6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background: radial-gradient(1200px 600px at 20% -10%, #2a1b5e 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #10306b 0%, transparent 60%), var(--bg); color:var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width:100%; max-width:440px; background:rgba(17,17,28,.92); border:1px solid var(--line); border-radius:20px; padding:28px; box-shadow:0 30px 80px rgba(0,0,0,.5); text-align:center; }
  .logo { font-weight:900; letter-spacing:.3em; font-size:13px; background:linear-gradient(90deg,var(--v),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { margin:14px 0 6px; font-size:24px; }
  p { color:var(--dim); margin:0 0 18px; }
  code { display:inline-flex; align-items:center; gap:8px; background:#0b0b14; border:1px solid var(--line); padding:8px 12px; border-radius:10px; font-size:15px; color:var(--text); word-break:break-all; }
  .btn { display:block; width:100%; margin-top:12px; padding:13px 16px; border-radius:12px; border:0; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; color:#fff; background:linear-gradient(90deg,var(--v),var(--b)); }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:600; }
  .small { font-size:12.5px; color:var(--dim); margin-top:16px; }
  button.copy { background:none; border:0; color:var(--dim); cursor:pointer; font:inherit; padding:0; }
  .err { color:#ff7b9c; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">VORTEX CLIENT</div>
  <h1 id="title">Server beitreten</h1>
  <p id="sub">Öffnet den Vortex Client Launcher und verbindet dich direkt.</p>
  <code id="addr">…</code>
  <a class="btn" id="open" href="#">Im Launcher öffnen</a>
  <a class="btn ghost" id="dl" href="https://github.com/Marcinator31/Vortex-Launcher/releases/latest">Launcher herunterladen</a>
  <div class="small" id="hint">Nichts passiert? Dann ist der Launcher noch nicht installiert – lade ihn oben herunter, oder füge die Adresse in Minecraft unter „Mehrspieler“ ein.</div>
</main>
<script>
(function () {
  var de = /^de\b/i.test(navigator.language || '');
  var T = de ? {} : {
    title: 'Join server', sub: 'Opens the Vortex Client launcher and connects you directly.', open: 'Open in launcher',
    dl: 'Download the launcher', hint: 'Nothing happens? Then the launcher is not installed yet – download it above, or paste the address in Minecraft under "Multiplayer".',
    bad: 'This invite link is broken.', copied: 'copied'
  };
  if (!de) {
    document.documentElement.lang = 'en';
    document.getElementById('title').textContent = T.title;
    document.getElementById('sub').textContent = T.sub;
    document.getElementById('open').textContent = T.open;
    document.getElementById('dl').textContent = T.dl;
    document.getElementById('hint').textContent = T.hint;
  }
  var q = new URLSearchParams(location.search);
  var s = String(q.get('s') || '').trim().toLowerCase();
  var v = String(q.get('v') || '').trim();
  var host = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}(?::\d{1,5})?$/;
  var ip = /^(?:\d{1,3}\.){3}\d{1,3}(?::\d{1,5})?$/;
  var addr = document.getElementById('addr');
  if (!host.test(s) && !ip.test(s)) {
    addr.textContent = de ? 'Dieser Einladungslink ist kaputt.' : T.bad;
    addr.className = 'err';
    document.getElementById('open').style.display = 'none';
    return;
  }
  addr.textContent = s;
  var copy = document.createElement('button');
  copy.className = 'copy'; copy.textContent = '⧉'; copy.title = de ? 'Kopieren' : 'Copy';
  copy.onclick = function () { navigator.clipboard && navigator.clipboard.writeText(s); copy.textContent = '✓'; };
  addr.appendChild(copy);
  var link = 'vortex://join/' + encodeURIComponent(s).replace(/%3A/gi, ':') + (/^\d+\.\d+(\.\d+)?$/.test(v) ? '?v=' + v : '');
  document.getElementById('open').href = link;
  document.title = (de ? 'Beitreten: ' : 'Join: ') + s + ' – Vortex Client';
  setTimeout(function () { location.href = link; }, 400);
})();
</script>
</body>
</html>
